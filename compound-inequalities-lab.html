<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مختبر الجسر والجناحين – حل المتباينات المركبة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF2F6; --panel:#FFFFFF; --ink:#16324F; --muted:#5B7088; --line:#9FB1C3;
  --blue:#2F6FDB; --yellow:#E2A812; --green:#1F9D5B; --red:#C83E3E; --hollow:#FFFFFF;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1E2C; --panel:#162A3D; --ink:#E6EEF6; --muted:#9DB0C4; --line:#4E6680;
    --blue:#6FA1FF; --yellow:#F5C443; --green:#45C985; --red:#F07272; --hollow:#162A3D;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1E2C; --panel:#162A3D; --ink:#E6EEF6; --muted:#9DB0C4; --line:#4E6680;
  --blue:#6FA1FF; --yellow:#F5C443; --green:#45C985; --red:#F07272; --hollow:#162A3D;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Readex Pro",Tahoma,"Segoe UI",sans-serif;line-height:1.6}
main{max-width:1100px;margin:0 auto;padding:24px 20px 40px}
h1{font-size:clamp(1.6rem,3.5vw,2.4rem);margin:0;font-weight:700}
.sub{color:var(--muted);margin:4px 0 20px;font-size:1.05rem}
/* math written right-to-left as in the Saudi textbook: tokens are laid out in visual order */
.m{display:inline-flex;direction:ltr;unicode-bidi:isolate;gap:.28em;align-items:baseline;white-space:nowrap}
.m .n{direction:ltr;unicode-bidi:bidi-override}
.m .w{direction:rtl;unicode-bidi:isolate}
.builder{display:flex;flex-wrap:wrap;align-items:center;gap:12px;background:var(--panel);padding:16px;border-radius:14px;border:1px solid var(--line)}
.ineq{display:flex;align-items:center;gap:8px;font-size:1.3rem;font-weight:500;padding:6px 10px;border-radius:10px}
.ineq.a{box-shadow:inset 0 -4px 0 var(--blue)}
.ineq.b{box-shadow:inset 0 -4px 0 var(--yellow)}
.ineq .var{font-size:1.6rem;font-weight:700}
select{font:inherit;font-size:1.05rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
.ineq select{direction:ltr;unicode-bidi:isolate;text-align:center;font-size:1.45rem;font-weight:700;min-width:3.4em}
.conn{display:flex;border:2px solid var(--ink);border-radius:999px;overflow:hidden}
.conn button{font:inherit;font-size:1.25rem;font-weight:700;border:0;background:transparent;color:var(--ink);padding:4px 20px;cursor:pointer}
.conn button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.preview{flex-basis:100%;font-size:1.5rem;font-weight:700;padding-top:6px;border-top:1px dashed var(--line)}
.preview small{font-size:1rem;font-weight:400;color:var(--muted);margin-inline-end:8px}
.presets{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 18px}
.presets > span{color:var(--muted);align-self:center;margin-inline-end:4px}
.presets button{font:inherit;font-size:1rem;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:4px 14px;cursor:pointer}
.presets button:hover{border-color:var(--ink)}
.stage{background:var(--panel);border-radius:14px;border:1px solid var(--line);padding:10px 8px 18px}
.stage-wrap{overflow-x:auto}
svg{display:block;width:100%;min-width:640px;height:auto}
.axis{stroke:var(--ink);stroke-width:3}
.tick{stroke:var(--ink);stroke-width:2}
.num{fill:var(--ink);font-size:19px;font-family:"Readex Pro",Tahoma,sans-serif;text-anchor:middle}
.grow{animation:grow 1.1s ease-out forwards}
@keyframes grow{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
.fade{animation:fade .6s ease-out .9s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.guide{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 6}
.caption{text-align:center;font-size:clamp(1.15rem,2.4vw,1.5rem);margin:10px 12px 0;min-height:2.6em}
.result{text-align:center;font-size:clamp(1.5rem,3.6vw,2.4rem);font-weight:700;color:var(--green);min-height:1.5em}
.result.empty{color:var(--red)}
.result small{display:block;font-size:1rem;font-weight:400;color:var(--muted)}
.controls{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:18px;align-items:center}
.btn{font:inherit;font-size:1.1rem;font-weight:500;border-radius:10px;padding:10px 22px;cursor:pointer;border:2px solid var(--ink);background:transparent;color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--panel)}
.btn:disabled{opacity:.4;cursor:default}
label.toggle{display:flex;gap:8px;align-items:center;color:var(--muted);cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.hint{color:var(--muted);text-align:center;font-size:.95rem;margin-top:14px}
@media (prefers-reduced-motion:reduce){.grow,.fade{animation:none;stroke-dashoffset:0;opacity:1}}
</style>
</head>
<body>
<main>
  <h1>مختبر الجسر والجناحين</h1>
  <p class="sub">حل المتباينات المركبة وتمثيلها على خط الأعداد – رياضيات الصف الثالث المتوسط</p>

  <section class="builder" aria-label="كتابة المتباينة المركبة">
    <div class="ineq a"><span class="var">س</span>
      <select id="op1" aria-label="علاقة المتباينة الأولى"></select>
      <select id="v1" aria-label="عدد المتباينة الأولى"></select>
    </div>
    <div class="conn" role="group" aria-label="أداة الربط">
      <button id="cAnd" aria-pressed="true">و</button>
      <button id="cOr" aria-pressed="false">أو</button>
    </div>
    <div class="ineq b"><span class="var">س</span>
      <select id="op2" aria-label="علاقة المتباينة الثانية"></select>
      <select id="v2" aria-label="عدد المتباينة الثانية"></select>
    </div>
    <div class="preview"><small>المتباينة المركبة:</small><span id="preview"></span></div>
  </section>

  <div class="presets" id="presetsA" style="margin-bottom:6px"><span>أمثلة الحصة الأولى «و»:</span></div>
  <div class="presets" id="presetsB" style="margin-top:0"><span>أمثلة الحصة الثانية «أو»:</span></div>

  <section class="stage" aria-live="polite">
    <div class="stage-wrap"><svg id="svg" viewBox="0 0 1000 290" direction="ltr" role="img" aria-label="خط الأعداد"></svg></div>
    <p class="caption" id="caption"></p>
    <div class="result" id="result"></div>
  </section>

  <div class="controls">
    <button class="btn primary" id="next">الخطوة التالية</button>
    <button class="btn" id="play">تشغيل كامل</button>
    <button class="btn" id="reset">إعادة</button>
    <label class="toggle"><input type="checkbox" id="challenge" checked> وضع التحدي (توقّف قبل كشف الحل)</label>
  </div>
  <p class="hint">مفتاح المسافة: الخطوة التالية، ومفتاح R: إعادة</p>
</main>

<script>
const NS="http://www.w3.org/2000/svg", MIN=-10, MAX=10, Y1=60, Y2=120, YM=205;
const xOf=v=>50+(v-MIN)*45;
const $=id=>document.getElementById(id);
const svg=$("svg");
let conn="و", step=0, timer=null;

/* ---------- Arabic math formatting ---------- */
const AD="٠١٢٣٤٥٦٧٨٩";
const ad=n=>String(Math.abs(n)).replace(/\d/g,d=>AD[d]);
const numVisual=n=>ad(n)+(n<0?"−":"");          // visual: digits then minus on the right, as in the textbook
const MIRROR={"<":">",">":"<","≤":"≥","≥":"≤","{":"}","}":"{"};
// tokens in logical (reading) order; rendered right-to-left
function M(tokens){
  return '<span class="m">'+tokens.slice().reverse().map(t=>{
    if(t.n!==undefined)return '<span class="n">'+numVisual(t.n)+'</span>';
    if(t.w)return '<span class="w">'+t.w+'</span>';
    if(t.v)return '<span>س</span>';
    return '<span>'+(MIRROR[t.s]||t.s)+'</span>';
  }).join("")+'</span>';
}
const OPS=[{k:"<",t:"أصغر من"},{k:"≤",t:"أصغر من أو يساوي"},{k:">",t:"أكبر من"},{k:"≥",t:"أكبر من أو يساوي"}];
["op1","op2"].forEach(id=>OPS.forEach(o=>{const e=document.createElement("option");e.value=o.k;e.textContent=MIRROR[o.k];e.title=o.t;$(id).appendChild(e);}));
["v1","v2"].forEach(id=>{for(let v=-9;v<=9;v++){const e=document.createElement("option");e.value=v;e.textContent=numVisual(v);$(id).appendChild(e);}});
$("op1").value="≥";$("v1").value=-5;$("op2").value="<";$("v2").value=5;

/* ---------- interval logic ---------- */
function toInt(op,a){
  if(op==="<")return{lo:-Infinity,loI:false,hi:a,hiI:false};
  if(op==="≤")return{lo:-Infinity,loI:false,hi:a,hiI:true};
  if(op===">")return{lo:a,loI:false,hi:Infinity,hiI:false};
  return{lo:a,loI:true,hi:Infinity,hiI:false};
}
function isEmpty(i){return i.lo>i.hi||(i.lo===i.hi&&!(i.loI&&i.hiI));}
function inter(a,b){
  const r={};
  if(a.lo>b.lo){r.lo=a.lo;r.loI=a.loI}else if(b.lo>a.lo){r.lo=b.lo;r.loI=b.loI}else{r.lo=a.lo;r.loI=a.loI&&b.loI}
  if(a.hi<b.hi){r.hi=a.hi;r.hiI=a.hiI}else if(b.hi<a.hi){r.hi=b.hi;r.hiI=b.hiI}else{r.hi=a.hi;r.hiI=a.hiI&&b.hiI}
  return isEmpty(r)?[]:[r];
}
function union(a,b){
  let [p,q]=a.lo<b.lo||(a.lo===b.lo&&a.loI)?[a,b]:[b,a];
  const touch=p.hi>q.lo||(p.hi===q.lo&&(p.hiI||q.loI));
  if(!touch)return[p,q];
  const r={lo:p.lo,loI:p.lo===q.lo?(p.loI||q.loI):p.loI};
  if(p.hi>q.hi){r.hi=p.hi;r.hiI=p.hiI}else if(q.hi>p.hi){r.hi=q.hi;r.hiI=q.hiI}else{r.hi=p.hi;r.hiI=p.hiI||q.hiI}
  return[r];
}
// interval -> tokens (logical order), null = all reals
function tok(i){
  const V={v:1};
  if(i.lo===-Infinity&&i.hi===Infinity)return null;
  if(i.lo===-Infinity)return[V,{s:i.hiI?"≤":"<"},{n:i.hi}];
  if(i.hi===Infinity)return[V,{s:i.loI?"≥":">"},{n:i.lo}];
  if(i.lo===i.hi)return[V,{s:"="},{n:i.lo}];
  return[{n:i.lo},{s:i.loI?"≤":"<"},V,{s:i.hiI?"≤":"<"},{n:i.hi}];
}
const opTok=(op,v)=>[{v:1},{s:op},{n:v}];
const setOf=parts=>[{s:"{"},{v:1},{s:"|"},...parts,{s:"}"}];

/* ---------- presets (examples from the lesson) ---------- */
const presets=[
  {o1:"≥",v1:-5,c:"و",o2:"<",v2:5},
  {o1:"<",v1:-2,c:"أو",o2:"≥",v2:3},
  {o1:"≥",v1:-3,c:"و",o2:"<",v2:-2},
  {o1:"≤",v1:-1,c:"أو",o2:">",v2:2},
  {o1:">",v1:5,c:"و",o2:"<",v2:2},
  {o1:">",v1:1,c:"أو",o2:"<",v2:4}
];
presets.forEach(p=>{
  const b=document.createElement("button");
  b.innerHTML=M([...opTok(p.o1,p.v1),{w:p.c},...opTok(p.o2,p.v2)]);
  b.onclick=()=>{$("op1").value=p.o1;$("v1").value=p.v1;$("op2").value=p.o2;$("v2").value=p.v2;setConn(p.c);reset();};
  $(p.c==="و"?"presetsA":"presetsB").appendChild(b);
});

/* ---------- drawing ---------- */
function el(tag,attrs,cls){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(cls)e.setAttribute("class",cls);return e;}
function drawInterval(i,y,color,animate,width){
  const g=el("g");
  const lo=Math.max(i.lo,MIN-0.6), hi=Math.min(i.hi,MAX+0.6);
  let x1,x2;
  if(i.lo===-Infinity&&i.hi!==Infinity){x1=xOf(i.hi);x2=xOf(lo)}else{x1=xOf(lo);x2=xOf(hi)}
  const len=Math.abs(x2-x1);
  const line=el("line",{x1,y1:y,x2,y2:y,stroke:color,"stroke-width":width},animate?"grow":"");
  if(animate){line.style.strokeDasharray=len;line.style.setProperty("--len",len);line.style.strokeDashoffset=len;}
  g.appendChild(line);
  [[i.lo,i.loI,-1],[i.hi,i.hiI,1]].forEach(([v,inc,dir])=>{
    if(Math.abs(v)===Infinity){
      const x=xOf(dir<0?MIN-0.6:MAX+0.6), s=14;
      g.appendChild(el("polygon",{points:dir<0?`${x-s},${y} ${x+2},${y-s} ${x+2},${y+s}`:`${x+s},${y} ${x-2},${y-s} ${x-2},${y+s}`,fill:color},animate?"fade":""));
    }else{
      g.appendChild(el("circle",{cx:xOf(v),cy:y,r:11,fill:inc?color:"var(--hollow)",stroke:color,"stroke-width":4}));
    }
  });
  return g;
}

function state(){
  const o1=$("op1").value,o2=$("op2").value,v1=+$("v1").value,v2=+$("v2").value;
  const a=toInt(o1,v1), b=toInt(o2,v2);
  return{a,b,o1,o2,v1,v2,res:conn==="و"?inter(a,b):union(a,b)};
}

function render(){
  const {a,b,o1,o2,v1,v2,res}=state();
  const t1=M(opTok(o1,v1)), t2=M(opTok(o2,v2));
  $("preview").innerHTML=M([...opTok(o1,v1),{w:conn},...opTok(o2,v2)]);
  svg.innerHTML="";
  const lastStep=$("challenge").checked?4:3;
  svg.appendChild(el("line",{x1:xOf(MIN)-20,y1:YM,x2:xOf(MAX)+20,y2:YM},"axis"));
  for(let v=MIN;v<=MAX;v++){
    svg.appendChild(el("line",{x1:xOf(v),y1:YM-8,x2:xOf(v),y2:YM+8},"tick"));
    const t=el("text",{x:xOf(v),y:YM+40,direction:"ltr","unicode-bidi":"bidi-override"},"num");
    t.textContent=numVisual(v);svg.appendChild(t);
  }
  if(step>=1)svg.appendChild(drawInterval(a,Y1,"var(--blue)",step===1,12));
  if(step>=2)svg.appendChild(drawInterval(b,Y2,"var(--yellow)",step===2,12));
  if(step>=3){
    const pts=new Set();
    [a,b].forEach(i=>[i.lo,i.hi].forEach(v=>{if(isFinite(v))pts.add(v)}));
    pts.forEach(v=>svg.appendChild(el("line",{x1:xOf(v),y1:Y1-20,x2:xOf(v),y2:YM},"guide")));
  }
  if(step>=lastStep)res.forEach(i=>svg.appendChild(drawInterval(i,YM,"var(--green)",step===lastStep,14)));

  const cap=$("caption"), out=$("result");
  out.className="result"; out.innerHTML="";
  if(step===0)cap.innerHTML="اضغط «الخطوة التالية» لنمثّل المتباينة الأولى على خط الأعداد.";
  if(step===1)cap.innerHTML=`المتباينة الأولى ${t1}: كل عدد تحت الشعاع الأزرق يحققها.`;
  if(step===2)cap.innerHTML=`المتباينة الثانية ${t2}: كل عدد تحت الشعاع الأصفر يحققها.`;
  if(step===3&&lastStep===4)cap.innerHTML=conn==="و"
    ?"«و» تعني أن الشرطين يتحققان معًا. أين يلتقي الأزرق والأصفر؟ ناقش زميلك قبل الكشف."
    :"«أو» يكفيها تحقق شرط واحد. ما الأعداد التي تقع تحت أي شعاع منهما؟ ناقش زميلك قبل الكشف.";
  if(step>=lastStep){
    if(res.length===0){
      cap.innerHTML="التمثيلان لا يشتركان في أي عدد، فلا يوجد عدد يحقق المتباينتين معًا.";
      out.className="result empty";out.innerHTML="مجموعة الحل: ∅ (المجموعة الخالية)";
    }else if(res.length===1&&tok(res[0])===null){
      cap.innerHTML="التمثيلان معًا يغطيان خط الأعداد كاملًا.";
      out.innerHTML="مجموعة الحل: جميع الأعداد الحقيقية";
    }else{
      cap.innerHTML=conn==="و"
        ?"«و» = التقاطع ∩: مجموعة الحل هي الجزء المشترك فقط (أزرق + أصفر = أخضر)."
        :"«أو» = الاتحاد ∪: مجموعة الحل هي كل ما ظُلّل بأي لون.";
      const parts=[];res.forEach((i,k)=>{if(k)parts.push({w:"أو"});parts.push(...tok(i));});
      out.innerHTML="<small>مجموعة الحل</small>"+M(setOf(parts));
    }
  }
  $("next").disabled=step>=lastStep;
}

function setConn(c){conn=c;$("cAnd").setAttribute("aria-pressed",c==="و");$("cOr").setAttribute("aria-pressed",c==="أو");}
function reset(){clearTimeout(timer);step=0;render();}
function next(){const last=$("challenge").checked?4:3;if(step<last){step++;render();}}
function play(){
  reset();
  // challenge mode stops at the question (step 3); otherwise step 3 is the reveal
  const tick=()=>{if(step<3){next();timer=setTimeout(tick,1500);}};
  tick();
}
$("cAnd").onclick=()=>{setConn("و");reset()};
$("cOr").onclick=()=>{setConn("أو");reset()};
["op1","v1","op2","v2","challenge"].forEach(id=>$(id).addEventListener("change",reset));
$("next").onclick=next;$("play").onclick=play;$("reset").onclick=reset;
document.addEventListener("keydown",e=>{
  if(e.target.matches("select,input"))return;
  if(e.code==="Space"){e.preventDefault();next();}
  if(e.key==="r"||e.key==="R")reset();
});
render();
</script>
</body>
</html>
